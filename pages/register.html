<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki - Project Chinoid</title>
    <link rel="stylesheet" href="../style/wiki.css">
</head>
<body class="wiki-body">
<div class="wiki-container">
    <header class="wiki-header">
        <img class="wiki-logo" src="../meta/logo.png" alt="Project Chinoid Logo">
    </header>
    <main class="wiki-main-content">
        <div class="wiki-box">
            <form action="cadastro_guia" method="post">
                <fieldset>
                    <legend><h1>Criar conta de usuário</h1></legend>
                    <br>
                    <div>
                        <label for="Nickname"><strong>Nickname:</strong></label>
                        <input type="text" id="Nickname" name="Nickname" placeholder="nomeDaConta..." required>
                    </div>
                    <br>
                    <div>
                        <label for="Email"><strong>Email:</strong></label>
                        <input type="email" id="Email" name="Email" placeholder="exemplo@email.com" required>
                    </div>
                    <br>
                    <div>
                        <label for="Senha"><strong>Senha:</strong></label>
                        <input type="password" id="Senha" name="Senha" placeholder="..." required>
                    </div>
                    <br>
                    <div>
                        <label for="Senharep"><strong>Repita a senha:</strong></label>
                        <input type="password" id="Senharep" name="Senharep" placeholder="..." required>
                    </div>
                    <br>
                    <div>
                        <div>
                            <h2 id="PasswordMessage"></h2>
                        </div>
                        <div>
                            <h2 style="color: aliceblue;">Força da senha:</h2>
                            <h2 id="Forca" style="color: aliceblue;">-</h2>
                        </div>
                    </div>
                    <div class="form-buttons">
                        <button class="wiki-button" type="submit">Criar Conta</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </main>
</div>
<script src="../js/formvalidation.js"></script>
<script>
    const senha = document.getElementById("Senha");
    const confirmarSenha = document.getElementById("Senharep");
    const forca = document.getElementById("Forca");
    const message = document.getElementById("PasswordMessage")
    const warnings = {
            strengthStrings : ["FORTE!","bruh...","fraca","média"],

            messages : ["","A senha precisa conter pelo menos 8 caracteres!",
            "A senha precisa conter um número!",
            "A senha precisa conter um caractere especial!",""],

            colors : ["color: green","color: red;",
            "color: saddlebrown;",
            "color: orange;"]
        }
    
    function validarSenhas() {
        let passString = senha.value.toString();

        if(passString.length == 0){
            forca.textContent = "-";
            forca.style = "color: aliceblue;";
            message.textContent = "";
            message.style = "";
            return
        }

        let passconfirmString = confirmarSenha.value.toString();

        senha.setCustomValidity("");
        confirmarSenha.setCustomValidity("");

        let strength = checkPasswordStrength(passString);
  
        message.textContent = warnings.messages[strength];
        message.style = warnings.colors[strength];
        forca.textContent = warnings.strengthStrings[strength];
        forca.style = warnings.colors[strength];

        senha.setCustomValidity(warnings.messages[strength]);

        if(senha.checkValidity() && passString !== passconfirmString){
            message.textContent = "As senhas precisam ser iguais!";
            message.style = "color: orange;";
            confirmarSenha.setCustomValidity("As senhas precisam ser iguais!");
        }
    }

    senha.addEventListener('input', validarSenhas);
    confirmarSenha.addEventListener('keyup', validarSenhas);
</script>

</body>
</html>
