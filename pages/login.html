<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki - Project Chinoid</title>
    <link rel="stylesheet" href="../style/wiki.css">
</head>
<body class="wiki-body">
<div class="wiki-container">
    <header class="wiki-header">
        <img class="wiki-logo" src="../meta/logo.png" alt="Project Chinoid Logo">
    </header>
    <main class="wiki-main-content">
        <div class="wiki-box">
            <form action="cadastro_guia" method="post">
                <fieldset>
                    <legend><h1>Fazer Login</h1></legend>
                    <br>
                    <div>
                        <label for="Nickname/email"><strong>Nickname/Email:</strong></label>
                        <input type="text" id="Nickname/email" name="Nickname/email" placeholder="nomeDaConta..." required>
                    </div>
                    <br>
                    <div>
                        <label for="Senha"><strong>Senha:</strong></label>
                        <input type="password" id="Senha" name="Senha" placeholder="..." required>
                    </div>
                    <br>
                    <div class="form-buttons">
                        <button class="wiki-button" type="submit">Entrar</button>
                    </div>
                    <p class="form-redirect">
                        Não tem uma conta? <a href="register.html">Criar uma conta</a>
                    </p>
                </fieldset>
            </form>
        </div>
    </main>
</div>
<script>
    const passMaxLength = 32;
    
</script>
</body>
</html>
